  /experiments/api/{uid}:
    get:
      operationId: getExperiment
      summary: Get experiment
      description: Retrieve a specific experiment by UID.
      tags:
        - Experiments
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experiment details
          content:
            application/json:
              schema:

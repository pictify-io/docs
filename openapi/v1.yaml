          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /experiments/api/{uid}/complete:
    post:
      operationId: completeExperiment
      summary: Complete experiment
      description: |
        Complete an experiment and declare a winner. Requires `winnerVariantId`.

        Valid transitions: `running` → `completed`, `paused` → `completed`
      tags:
        - Experiments
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - winnerVariantId
              properties:
                winnerVariantId:
                  type: string
                  description: ID of the winning variant
                  example: variant-a
      responses:
        '200':
          description: Experiment completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment:
                    $ref: '#/components/schemas/Experiment'
        '400':
          description: Missing or invalid winnerVariantId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /s/events:
    post:
      operationId: trackExperimentEvents
      summary: Track experiment events
      description: |
        Track impressions, views, clicks, and conversions for experiments.
        Accepts a single event object or an array of up to 100 events.

        **Authentication**: Use the `X-Write-Key` header or `writeKey` field in the request body.
        Events are accepted without a write key, but this is strongly discouraged as it
        allows anyone to inject events and corrupt experiment data.

        **Rate limit**: 1000 requests/minute per IP. Max batch size: 100 events.
      tags:
        - Experiments
      security:
        - writeKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ExperimentEvent'
                - type: array
                  items:
                    $ref: '#/components/schemas/ExperimentEvent'
                  maxItems: 100
          text/plain:
            schema:
              type: string
              description: JSON string (for sendBeacon compatibility)
      responses:
        '200':
          description: Events processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentEventResponse'
        '400':
          description: Invalid event data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /s/{slug}/click:
    get:
      operationId: trackExperimentClick
      summary: Click tracking redirect
      description: |
        Redirect users through a tracked click. Records a click event and redirects
        to the experiment's `goalConfig.destinationUrl`.

        Use this in `<a>` tags wrapping experiment images for click-through tracking.
      tags:
        - Experiments
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Experiment slug
      responses:
        '302':
          description: Redirect to destination URL
        '404':
          description: Experiment not found

  /s/{slug}/pixel.gif:
    get:
      operationId: trackExperimentPixel
      summary: Tracking pixel
      description: |
        Returns a 1x1 transparent GIF and records an impression event.
        Use this for email open tracking or invisible impression tracking.

        ```html
        <img src="https://api.pictify.io/s/homepage-hero/pixel.gif" width="1" height="1" />
        ```

        Always returns a valid pixel, even for invalid slugs (to prevent broken images).
      tags:
        - Experiments
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Experiment slug
      responses:
        '200':
          description: 1x1 transparent GIF
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache, no-store, must-revalidate
          content:
            image/gif:
              schema:
                type: string
                format: binary

tags:
  - name: Images
    description: Image generation endpoints
  - name: GIFs
    description: GIF generation and capture
  - name: PDFs
    description: PDF generation
  - name: Templates
    description: Template management
  - name: Batch
    description: Batch rendering operations
  - name: Experiments
    description: A/B testing, smart links, and scheduled variant experiments
  - name: Webhooks
    description: Webhook subscription management
  - name: Bindings
    description: Data binding for auto-rendering

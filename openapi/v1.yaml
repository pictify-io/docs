  /experiments/api:
    get:
      operationId: listExperiments
      summary: List experiments
      description: Retrieve all experiments for the authenticated team.
      tags:
        - Experiments
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [ab_test, smart_link, scheduled]
          description: Filter by experiment type
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, running, paused, completed]
          description: Filter by status
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of results per page
      responses:
        '200':
          description: List of experiments
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experiment'
                  total:
                    type: integer
                    description: Total number of experiments matching filters
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createExperiment
      summary: Create experiment
      description: |
        Create a new experiment. Requires at least 2 variants with weights summing to exactly 10000.

        Slug must be unique among active experiments, 3-60 characters, lowercase alphanumeric and hyphens.
        Reserved slugs: events, api, admin, health, status, pixel, track, sdk.
      tags:
        - Experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - slug
                - variants
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Experiment name
                  example: Homepage Hero A/B Test
                type:
                  type: string
                  enum: [ab_test, smart_link, scheduled]
                  description: Experiment type
                slug:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$"
                  description: URL-friendly identifier (3-60 chars)
                  example: homepage-hero-test
                templateUid:
                  type: string
                  description: Default template UID (optional if each variant has its own)
                  example: tmpl_xyz789
                variants:
                  type: array
                  minItems: 2
                  items:
                    $ref: '#/components/schemas/ExperimentVariant'
                  description: "Variants with weights summing to 10000"
                goalConfig:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [impressions_only, click_through]
                      default: impressions_only
                    destinationUrl:
                      type: string
                      format: uri
                banditConfig:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    algorithm:
                      type: string
                      enum: [thompson_sampling, epsilon_greedy]
                      default: thompson_sampling
                    warmupImpressions:
                      type: integer
                      default: 50
                    recomputeIntervalMinutes:
                      type: integer
                      default: 15
                hypothesis:
                  type: string
                  maxLength: 500
                minimumSampleSize:
                  type: integer
                  default: 1000
                confidenceThreshold:
                  type: number
                  default: 0.95
                minimumRunDays:
                  type: integer
                  default: 7
                outputConfig:
                  type: object
                  properties:
                    format:
                      type: string
                      enum: [png, jpeg, webp]
                      default: png
                    quality:
                      type: number
                      default: 90
                fallbackImageUrl:
                  type: string
                  format: uri
                fallbackTemplateUid:
                  type: string
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment:
                    $ref: '#/components/schemas/Experiment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Experiment quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateExperiment
      summary: Update experiment
      description: |
        Update an experiment. Available fields depend on the current status:
        - **draft/paused**: All fields can be updated
        - **running**: Only name, confidenceThreshold, minimumRunDays, goalConfig.destinationUrl
        - **completed**: Only name
      tags:
        - Experiments
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                slug:
                  type: string
                variants:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExperimentVariant'
                goalConfig:
                  type: object
                banditConfig:
                  type: object
                hypothesis:
                  type: string
                confidenceThreshold:
                  type: number
                minimumRunDays:
                  type: integer
                outputConfig:
                  type: object
                fallbackImageUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Experiment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiment:
                    $ref: '#/components/schemas/Experiment'
        '400':
          description: Validation error or field not editable in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteExperiment
      summary: Delete experiment
      description: Soft-delete an experiment. Running experiments must be paused or completed first.
      tags:
        - Experiments
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experiment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '404':
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /experiments/api/{uid}/start:
    post:
      operationId: startExperiment
      summary: Start experiment
      description: |
        Start a draft or paused experiment. Begins serving variant images and tracking events.

        Valid transitions: `draft` → `running`, `paused` → `running`
      tags:
        - Experiments
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experiment started

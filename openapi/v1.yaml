  /templates/{uid}/render:
    post:
      operationId: renderTemplate
      summary: Render a template
      description: Generate an image from a template with variables
      tags:
        - Templates
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
                  description: Key-value pairs of template variable values
                format:
                  type: string
                  enum: [png, jpeg, webp, pdf]
                  default: png
                  description: Output image format
                quality:
                  type: number
                  minimum: 0.1
                  maximum: 1
                  default: 0.9
                  description: Image quality (0.1-1.0)
                layout:
                  type: string
                  pattern: '^[a-z0-9-]{1,64}$'
                  description: Render a specific layout variant (e.g. 'twitter-post', 'facebook-post'). Omit for default layout.
                layouts:
                  type: array
                  items:
                    type: string
                  maxItems: 20
                  description: Render multiple layout variants in one request. Use 'default' for the base layout. Returns an array of results.
                  example: ["default", "twitter-post", "facebook-post"]
      responses:
        '200':
          description: Rendered image(s). Always returns a `results` array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderResponse'


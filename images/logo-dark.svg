  <!-- P letter -->
  <text x="20" y="30" font-family="DynaPuff, Comic Sans MS, cursive" font-size="28" font-weight="700" fill="white" text-anchor="middle">P</text>
  <!-- Text - PICTIFY -->
  <text x="50" y="28" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">PICTIFY</text>
